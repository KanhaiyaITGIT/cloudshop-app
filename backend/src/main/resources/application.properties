# App
spring.application.name=shopeasy-backend
server.port=8080

# PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:shopeasy}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# JWT
jwt.secret=${JWT_SECRET:shopeasy-super-secret-key-minimum-32-characters-long}
jwt.expiration=86400000

# AWS
aws.region=${AWS_REGION:ap-south-1}
aws.sns.order-topic-arn=${SNS_ORDER_TOPIC_ARN:}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always